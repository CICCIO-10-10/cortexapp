<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok OAuth Callback - Cortex</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9fafb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            width: 100%;
        }
        h1 {
            color: #111827;
            font-size: 1.4rem;
            margin-top: 0;
        }
        .label {
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 4px;
        }
        .code-box {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 14px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            word-break: break-all;
            margin-bottom: 16px;
        }
        button {
            background-color: #8b5cf6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
        }
        button:active {
            background-color: #7c3aed;
        }
        .error {
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 14px;
        }
        .ok {
            color: #16a34a;
            font-weight: 600;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <h1>Autorizzazione TikTok completata</h1>
        <p>Il collegamento avviato dalla pagina admin viene completato automaticamente.</p>

        <div id="content"></div>
    </div>

    <script>
      const params=new URLSearchParams(location.search),code=params.get('code'),state=params.get('state'),content=document.getElementById('content');
      history.replaceState(null,'',location.pathname);
      try { localStorage.removeItem('cortex_admin_key'); sessionStorage.removeItem('cortex_admin_key'); } catch (_) {}
      const show=text=>{content.textContent=text;};
      if(params.get('error'))show('Autorizzazione non riuscita: '+(params.get('error_description')||params.get('error')));
      else if(code&&/^[a-f0-9]{64}$/.test(state||'')){
        show('Completamento autorizzazione…');
        fetch('/api/tiktok/exchange',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,state})})
        .then(async r=>{const data=await r.json();if(!r.ok||!data.success)throw Error(data.error||'Scambio non riuscito');show('Account TikTok connesso.');})
        .catch(e=>show(e.message)).finally(()=>{const a=document.createElement('a');a.href='/admin-tiktok.html';a.textContent=' Torna alla pagina admin';content.appendChild(a);});
      }else if(code){show('Codice per il flusso esterno: '+code+' — State: '+(state||'(nessuno)'));}
      else show('Nessun codice ricevuto. Ricomincia il collegamento dalla pagina admin.');
    </script>
</body>
</html>
